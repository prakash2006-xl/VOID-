<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#0f172a; font-family:'Inter',system-ui,sans-serif;">
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">VOID FAILURE DETECTION, RECOVERY &amp; REPLANNING ENGINE</text>
  <text x="480" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">Bounded Retries (Max 2) + Alternative Strategy Formulation + Graceful Rollback Protection</text>

  <!-- Task Failure Event -->
  <rect x="60" y="95" width="230" height="80" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="175" y="125" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">TASK FAILURE DETECTED</text>
  <text x="175" y="145" fill="#94a3b8" font-size="10" text-anchor="middle">Non-zero exit code / Exception</text>
  <text x="175" y="160" fill="#64748b" font-size="9" text-anchor="middle">or Verifier rejection</text>

  <line x1="290" y1="135" x2="340" y2="135" stroke="#f43f5e" stroke-width="2"/>

  <!-- Recovery Agent Analysis -->
  <rect x="340" y="95" width="280" height="80" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="480" y="125" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">RECOVERY AGENT CLASSIFIER</text>
  <text x="480" y="145" fill="#94a3b8" font-size="10" text-anchor="middle">Inspects stderr, exit code &amp; plan context</text>
  <text x="480" y="160" fill="#f59e0b" font-size="10" text-anchor="middle">Checks: retry_count &lt; max_retries (2)</text>

  <line x1="620" y1="135" x2="670" y2="135" stroke="#38bdf8" stroke-width="2"/>

  <!-- Decision Fork -->
  <rect x="670" y="95" width="230" height="80" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="785" y="125" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">STRATEGY SELECTION</text>
  <text x="785" y="145" fill="#94a3b8" font-size="10" text-anchor="middle">• Alternative tool parameters</text>
  <text x="785" y="160" fill="#94a3b8" font-size="10" text-anchor="middle">• Fallback tool substitution</text>

  <!-- Loop Path 1: Under Bound (Retry) -->
  <path d="M 785 175 L 785 240 L 480 240 L 480 270" stroke="#eab308" stroke-width="2" fill="none"/>
  <rect x="350" y="270" width="260" height="90" rx="8" fill="#0f172a" stroke="#eab308"/>
  <text x="480" y="300" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">BOUNDED RETRY (Attempt &lt;= 2)</text>
  <text x="480" y="322" fill="#94a3b8" font-size="10" text-anchor="middle">Applies alternative arguments &amp; re-executes</text>
  <text x="480" y="340" fill="#4ade80" font-size="10" text-anchor="middle">Logs recovery checkpoint to audit trail</text>

  <!-- Loop Path 2: Exceeded Bound (Safe Abort) -->
  <path d="M 850 175 L 850 270" stroke="#f43f5e" stroke-width="2" fill="none"/>
  <rect x="720" y="270" width="210" height="90" rx="8" fill="#0f172a" stroke="#f43f5e"/>
  <text x="825" y="300" fill="#fb7185" font-size="12" font-weight="700" text-anchor="middle">BOUND EXCEEDED (Attempt &gt; 2)</text>
  <text x="825" y="322" fill="#94a3b8" font-size="10" text-anchor="middle">Marks task as ABORTED</text>
  <text x="825" y="340" fill="#ef4444" font-size="10" text-anchor="middle">Prevents infinite looping</text>

  <!-- Bottom Safety Isolation Summary -->
  <rect x="60" y="395" width="840" height="95" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="425" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">CRITICAL FAULT ISOLATION GUARANTEE</text>
  <text x="480" y="450" fill="#f8fafc" font-size="11" text-anchor="middle">An unhandled agent crash or tool failure NEVER brings down the VOID desktop assistant,</text>
  <text x="480" y="468" fill="#94a3b8" font-size="10" text-anchor="middle">the voice pipeline, or Fedora desktop services. VOID gracefully falls back to deterministic voice interaction.</text>
</svg>