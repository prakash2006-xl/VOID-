  <line x1="737" y1="350" x2="737" y2="380" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="737" y1="380" x2="480" y2="380" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="480" y1="380" x2="480" y2="410" stroke="#38bdf8" stroke-width="1.5"/>
