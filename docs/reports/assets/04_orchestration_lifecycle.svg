  <text x="655" y="310" fill="#38bdf8" font-size="18" font-weight="700">➔</text>

  <rect x="670" y="265" width="135" height="80" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="737" y="292" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">11. FINAL RESULT</text>
