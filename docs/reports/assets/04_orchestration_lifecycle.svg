  <rect x="510" y="265" width="135" height="80" rx="8" fill="#1e293b" stroke="#f43f5e"/>
  <text x="577" y="292" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">10. RECOVERY GATE</text>
  <text x="577" y="312" fill="#94a3b8" font-size="10" text-anchor="middle">Failure / Retry</text>
