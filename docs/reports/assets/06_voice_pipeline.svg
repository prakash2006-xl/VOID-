<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#0f172a; font-family:'Inter',system-ui,sans-serif;">
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">VOID NEURAL VOICE &amp; AUDIO PROCESSING PIPELINE</text>
  <text x="480" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">Continuous Acoustic Wake FST + Faster-Whisper + Typo Normalizer + Piper Neural TTS via PipeWire</text>

  <!-- Mic Input -->
  <rect x="30" y="90" width="130" height="80" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="95" y="122" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1. AUDIO SINK</text>
  <text x="95" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">PipeWire / Alsa</text>
  <text x="95" y="157" fill="#64748b" font-size="9" text-anchor="middle">16kHz 16-bit Mono</text>

  <text x="168" y="135" fill="#38bdf8" font-size="16">➔</text>

  <!-- Vosk Wake -->
  <rect x="185" y="90" width="145" height="80" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="257" y="122" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">2. VOSK WAKE FST</text>
  <text x="257" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">Small-en-us Kaldi</text>
  <text x="257" y="157" fill="#64748b" font-size="9" text-anchor="middle">'Hey VOID' / 0% CPU</text>

  <text x="338" y="135" fill="#38bdf8" font-size="16">➔</text>

  <!-- Faster Whisper STT -->
  <rect x="355" y="90" width="155" height="80" rx="8" fill="#1e293b" stroke="#0ea5e9"/>
  <text x="432" y="122" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">3. FASTER-WHISPER</text>
  <text x="432" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">Base int8 Quantized</text>
  <text x="432" y="157" fill="#64748b" font-size="9" text-anchor="middle">VAD + ~0.8s Speech STT</text>

  <text x="518" y="135" fill="#38bdf8" font-size="16">➔</text>

  <!-- Typo & Slang Normalizer -->
  <rect x="535" y="90" width="170" height="80" rx="8" fill="#1e293b" stroke="#22c55e"/>
  <text x="620" y="122" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">4. TYPO NORMALIZER</text>
  <text x="620" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">Phonetic Slip Tolerance</text>
  <text x="620" y="157" fill="#64748b" font-size="9" text-anchor="middle">'opn crome' -> 'open chromium'</text>

  <text x="713" y="135" fill="#38bdf8" font-size="16">➔</text>

  <!-- Anti Reintroduction -->
  <rect x="730" y="90" width="190" height="80" rx="8" fill="#1e293b" stroke="#eab308"/>
  <text x="825" y="122" fill="#facc15" font-size="11" font-weight="700" text-anchor="middle">5. INTENT DISPATCH</text>
  <text x="825" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">Anti-Reintroduction Guard</text>
  <text x="825" y="157" fill="#64748b" font-size="9" text-anchor="middle">Direct vs Multi-Agent DAG</text>

  <!-- Response Pipeline -->
  <rect x="40" y="220" width="880" height="270" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="248" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">RESPONSE SYNTHESIS &amp; PLAYBACK TIER</text>

  <rect x="70" y="275" width="240" height="80" rx="8" fill="#0f172a" stroke="#64748b"/>
  <text x="190" y="305" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Speech Sanitizer</text>
  <text x="190" y="325" fill="#94a3b8" font-size="10" text-anchor="middle">Strips markdown asterisks, hashes,</text>
  <text x="190" y="340" fill="#94a3b8" font-size="10" text-anchor="middle">raw tool-call tags &amp; emojis</text>

  <line x1="310" y1="315" x2="360" y2="315" stroke="#38bdf8" stroke-width="2"/>

  <rect x="360" y="275" width="240" height="80" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="480" y="305" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">Piper Neural TTS</text>
  <text x="480" y="325" fill="#94a3b8" font-size="10" text-anchor="middle">vits-piper-en_US-ryan-medium</text>
  <text x="480" y="340" fill="#94a3b8" font-size="10" text-anchor="middle">22.05 kHz 16-bit Mono WAV</text>

  <line x1="600" y1="315" x2="650" y2="315" stroke="#38bdf8" stroke-width="2"/>

  <rect x="650" y="275" width="240" height="80" rx="8" fill="#0f172a" stroke="#22c55e"/>
  <text x="770" y="305" fill="#4ade80" font-size="12" font-weight="600" text-anchor="middle">Native PipeWire (pw-play)</text>
  <text x="770" y="325" fill="#94a3b8" font-size="10" text-anchor="middle">Zero PortAudio collision</text>
  <text x="770" y="340" fill="#94a3b8" font-size="10" text-anchor="middle">Fallback: paplay -> PortAudio</text>

  <!-- Bottom Safeguards -->
  <rect x="70" y="385" width="400" height="75" rx="8" fill="#0f172a" stroke="#f43f5e"/>
  <text x="270" y="412" fill="#fb7185" font-size="12" font-weight="700" text-anchor="middle">EMERGENCY ABORT (&lt;5ms)</text>
  <text x="270" y="432" fill="#94a3b8" font-size="10" text-anchor="middle">'Stop', 'Cancel', 'Abort', 'Shut up'</text>
  <text x="270" y="447" fill="#64748b" font-size="9" text-anchor="middle">Instantly kills audio subprocess &amp; cancels agentic planner</text>

  <rect x="490" y="385" width="400" height="75" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="690" y="412" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">HARDWARE INVARIANCE GUARD</text>
  <text x="690" y="432" fill="#94a3b8" font-size="10" text-anchor="middle">Strict Intent Filter for Volume &amp; Brightness</text>
  <text x="690" y="447" fill="#64748b" font-size="9" text-anchor="middle">Suppresses unprompted modifications by LLM hallucination</text>
</svg>