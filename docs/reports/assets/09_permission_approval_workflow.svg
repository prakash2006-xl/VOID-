<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#0f172a; font-family:'Inter',system-ui,sans-serif;">
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">VOID 4-TIER SECURITY &amp; APPROVAL QUEUE WORKFLOW</text>
  <text x="480" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">Zero-Unrestricted-Execution Policy with Interactive Human-in-the-Loop Gating</text>

  <!-- Incoming Tool Request -->
  <rect x="360" y="85" width="240" height="45" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="480" y="112" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">TOOL EXECUTION REQUEST</text>

  <line x1="480" y1="130" x2="480" y2="155" stroke="#38bdf8" stroke-width="2"/>

  <!-- Evaluator Diamond -->
  <polygon points="480,155 580,205 480,255 380,205" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="200" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">EVALUATE</text>
  <text x="480" y="215" fill="#94a3b8" font-size="10" text-anchor="middle">PERMISSION</text>

  <!-- Branch 1: Level 4 Forbidden -->
  <line x1="380" y1="205" x2="160" y2="205" stroke="#f43f5e" stroke-width="1.5"/>
  <line x1="160" y1="205" x2="160" y2="265" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="60" y="265" width="200" height="80" rx="8" fill="#1e293b" stroke="#f43f5e"/>
  <text x="160" y="292" fill="#fb7185" font-size="12" font-weight="700" text-anchor="middle">LEVEL 4: FORBIDDEN</text>
  <text x="160" y="310" fill="#94a3b8" font-size="10" text-anchor="middle">sudo, su, /etc, /root, /boot</text>
  <text x="160" y="325" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">➔ Immediate Hard Abort</text>

  <!-- Branch 2: Level 1 & 2 Auto -->
  <line x1="480" y1="255" x2="480" y2="320" stroke="#10b981" stroke-width="1.5"/>
  <rect x="360" y="320" width="240" height="75" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="480" y="345" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">LEVEL 1 &amp; 2: AUTO-APPROVED</text>
  <text x="480" y="363" fill="#94a3b8" font-size="10" text-anchor="middle">Read-only / Reversible in ~/Documents</text>
  <text x="480" y="378" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">➔ Sandboxed Execution</text>

  <!-- Branch 3: Level 3 Approval Queue -->
  <line x1="580" y1="205" x2="800" y2="205" stroke="#eab308" stroke-width="1.5"/>
  <line x1="800" y1="205" x2="800" y2="265" stroke="#eab308" stroke-width="1.5"/>
  <rect x="700" y="265" width="200" height="80" rx="8" fill="#1e293b" stroke="#eab308"/>
  <text x="800" y="292" fill="#facc15" font-size="12" font-weight="700" text-anchor="middle">LEVEL 3: APPROVAL REQ.</text>
  <text x="800" y="310" fill="#94a3b8" font-size="10" text-anchor="middle">Modifies existing project files</text>
  <text x="800" y="325" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle">➔ Holds in Approval Queue</text>

  <!-- Interactive Human In The Loop -->
  <line x1="800" y1="345" x2="800" y2="410" stroke="#eab308" stroke-width="1.5"/>
  <rect x="680" y="410" width="240" height="75" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="800" y="435" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">HUMAN-IN-THE-LOOP</text>
  <text x="800" y="453" fill="#94a3b8" font-size="10" text-anchor="middle">Voice or Widget Card Prompt</text>
  <text x="800" y="468" fill="#4ade80" font-size="10" text-anchor="middle">User Approves or Rejects</text>

  <!-- Audit trail footer -->
  <rect x="60" y="415" width="540" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="330" y="440" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">IMMUTABLE AUDIT LOGGING</text>
  <text x="330" y="458" fill="#94a3b8" font-size="10" text-anchor="middle">Every permission evaluation, approval, and rejected action is recorded</text>
  <text x="330" y="472" fill="#64748b" font-size="9" text-anchor="middle">with timestamps and masked parameters in logs/agentic_audit.jsonl</text>
</svg>