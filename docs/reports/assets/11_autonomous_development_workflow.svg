<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#0f172a; font-family:'Inter',system-ui,sans-serif;">
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">DEMO 2: AUTONOMOUS TEST-DRIVEN DEVELOPMENT (TDD) WORKFLOW</text>
  <text x="480" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">Goal: 'Create string utility module and verify with unit tests' (Self-Contained in ~/Documents/Projects)</text>

  <!-- Step 1 -->
  <rect x="40" y="100" width="200" height="100" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="140" y="130" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">1. GOAL DECOMPOSITION</text>
  <text x="140" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">Planner breaks request into</text>
  <text x="140" y="170" fill="#f8fafc" font-size="10" text-anchor="middle">Scaffold -> Code -> Test -> Verify</text>

  <text x="255" y="155" fill="#38bdf8" font-size="20">➔</text>

  <!-- Step 2 -->
  <rect x="280" y="100" width="200" height="100" rx="8" fill="#1e293b" stroke="#22c55e"/>
  <text x="380" y="130" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">2. SCAFFOLD PROJECT</text>
  <text x="380" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">Developer Agent creates</text>
  <text x="380" y="170" fill="#f8fafc" font-size="10" text-anchor="middle">~/Documents/Projects/string_utils</text>

  <text x="495" y="155" fill="#38bdf8" font-size="20">➔</text>

  <!-- Step 3 -->
  <rect x="520" y="100" width="200" height="100" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="620" y="130" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">3. WRITE CODE &amp; TESTS</text>
  <text x="620" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">Generates core.py with functions</text>
  <text x="620" y="170" fill="#f8fafc" font-size="10" text-anchor="middle">&amp; test_core.py with test cases</text>

  <text x="735" y="155" fill="#38bdf8" font-size="20">➔</text>

  <!-- Step 4 -->
  <rect x="750" y="100" width="170" height="100" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="835" y="130" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">4. EXECUTE TESTS</text>
  <text x="835" y="155" fill="#94a3b8" font-size="10" text-anchor="middle">Runs unittest / pytest</text>
  <text x="835" y="170" fill="#f8fafc" font-size="10" text-anchor="middle">in isolated subprocess</text>

  <!-- Second Row: Verification & Delivery -->
  <path d="M 835 200 L 835 240 L 140 240 L 140 270" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="4"/>

  <!-- Step 5 -->
  <rect x="40" y="270" width="260" height="110" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="170" y="300" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">5. INDEPENDENT VERIFIER</text>
  <text x="170" y="325" fill="#94a3b8" font-size="11" text-anchor="middle">Inspects exit_code == 0</text>
  <text x="170" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">Verifies test evidence output</text>
  <text x="170" y="365" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">Status: PASSED (3/3 unit tests)</text>

  <text x="320" y="330" fill="#38bdf8" font-size="20">➔</text>

  <!-- Step 6 -->
  <rect x="350" y="270" width="260" height="110" rx="8" fill="#1e293b" stroke="#0ea5e9"/>
  <text x="480" y="300" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">6. ARTIFACT TRACKING</text>
  <text x="480" y="325" fill="#94a3b8" font-size="11" text-anchor="middle">Logs created files into memory:</text>
  <text x="480" y="345" fill="#f8fafc" font-size="10" text-anchor="middle">• ~/Documents/Projects/string_utils/core.py</text>
  <text x="480" y="365" fill="#f8fafc" font-size="10" text-anchor="middle">• ~/Documents/Projects/string_utils/test_core.py</text>

  <text x="630" y="330" fill="#38bdf8" font-size="20">➔</text>

  <!-- Step 7 -->
  <rect x="660" y="270" width="260" height="110" rx="8" fill="#1e293b" stroke="#22c55e"/>
  <text x="790" y="300" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">7. SYNTHESIS &amp; SPEECH</text>
  <text x="790" y="325" fill="#94a3b8" font-size="11" text-anchor="middle">Supervisor speaks concise digest:</text>
  <text x="790" y="345" fill="#f8fafc" font-size="10" text-anchor="middle">"Scaffolded string_utils project and</text>
  <text x="790" y="365" fill="#f8fafc" font-size="10" text-anchor="middle">verified all tests pass in 0.45s."</text>

  <!-- Bottom Verification Badge -->
  <rect x="180" y="420" width="600" height="55" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="445" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">✔ VERIFIED COMPETITION CAPABILITY</text>
  <text x="480" y="462" fill="#94a3b8" font-size="11" text-anchor="middle">Demonstrates genuine multi-step coding, autonomous test execution, and ground-truth validation</text>
</svg>