<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#0f172a; font-family:'Inter',system-ui,sans-serif;">
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">VOID PERSISTENT MEMORY &amp; 7-DAY HIGH THOUGHT RETENTION</text>
  <text x="480" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">1.5GB NVMe Ring Buffer + 7-Day Rolling Thought Retention (168h) + Weekly Digest Synthesis</text>

  <!-- Left: 1.5GB Facts Engine -->
  <rect x="50" y="95" width="270" height="380" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="185" y="125" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">1.5 GB NVMe FACTS ENGINE</text>
  <text x="185" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">Persistent User Facts &amp; Context</text>

  <rect x="70" y="165" width="230" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="185" y="190" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">facts.json Storage</text>
  <text x="185" y="208" fill="#94a3b8" font-size="10" text-anchor="middle">Categorized user preferences &amp; facts</text>

  <rect x="70" y="240" width="230" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="185" y="265" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Automatic Ring Buffer</text>
  <text x="185" y="283" fill="#94a3b8" font-size="10" text-anchor="middle">1500 MB Max / 1200 MB LRU Prune</text>

  <rect x="70" y="315" width="230" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="185" y="340" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Fast-Path Commands</text>
  <text x="185" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">'Remember that...', 'Recall...', 'Memory status'</text>

  <rect x="70" y="390" width="230" height="60" rx="6" fill="#0f172a" stroke="#22c55e"/>
  <text x="185" y="415" fill="#4ade80" font-size="11" font-weight="600" text-anchor="middle">16-Turn Context Window</text>
  <text x="185" y="433" fill="#94a3b8" font-size="10" text-anchor="middle">Pronoun &amp; multi-turn continuity</text>

  <!-- Center: 7-Day High Memory Thoughts -->
  <rect x="345" y="95" width="270" height="380" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="480" y="125" fill="#c084fc" font-size="14" font-weight="700" text-anchor="middle">7-DAY HIGH THOUGHT POOL</text>
  <text x="480" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">168-Hour Rolling Episodic Traces</text>

  <rect x="365" y="165" width="230" height="60" rx="6" fill="#0f172a" stroke="#a855f7"/>
  <text x="480" y="190" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">weekly_episodes.jsonl</text>
  <text x="480" y="208" fill="#e9d5ff" font-size="10" text-anchor="middle">Stores reasoning, goals, plan IDs, artifacts</text>

  <rect x="365" y="240" width="230" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="480" y="265" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Time Window Pruning</text>
  <text x="480" y="283" fill="#94a3b8" font-size="10" text-anchor="middle">cutoff = now - 604,800 seconds</text>

  <rect x="365" y="315" width="230" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="480" y="340" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Full Agentic Tracking</text>
  <text x="480" y="358" fill="#94a3b8" font-size="10" text-anchor="middle">Logs every specialist action &amp; deliverable</text>

  <rect x="365" y="390" width="230" height="60" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="480" y="415" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">Deep Contextual Retrieval</text>
  <text x="480" y="433" fill="#94a3b8" font-size="10" text-anchor="middle">'What did we do this week?' / Recap</text>

  <!-- Right: Weekly Digest Synthesis -->
  <rect x="640" y="95" width="270" height="380" rx="10" fill="#1e293b" stroke="#10b981"/>
  <text x="775" y="125" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">WEEKLY DIGEST SYNTHESIZER</text>
  <text x="775" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">Structured &amp; Human-Readable Digests</text>

  <rect x="660" y="165" width="230" height="75" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="775" y="190" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">weekly_memory_YYYY_WW.json</text>
  <text x="775" y="208" fill="#94a3b8" font-size="10" text-anchor="middle">Activity by day, topics covered,</text>
  <text x="775" y="222" fill="#94a3b8" font-size="10" text-anchor="middle">complete array of created deliverables</text>

  <rect x="660" y="255" width="230" height="85" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="775" y="280" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">weekly_memory_YYYY_WW.md</text>
  <text x="775" y="298" fill="#94a3b8" font-size="10" text-anchor="middle">1. Executive Summary &amp; Highlights</text>
  <text x="775" y="313" fill="#94a3b8" font-size="10" text-anchor="middle">2. Deliverables &amp; Files Created</text>
  <text x="775" y="328" fill="#94a3b8" font-size="10" text-anchor="middle">3. Chronological Thought Traces</text>

  <rect x="660" y="355" width="230" height="60" rx="6" fill="#0f172a" stroke="#0284c7"/>
  <text x="775" y="380" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Zero Data Corruption</text>
  <text x="775" y="398" fill="#94a3b8" font-size="10" text-anchor="middle">Strict isolation from legacy facts.json</text>
</svg>