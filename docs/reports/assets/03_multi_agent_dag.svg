<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#0f172a; font-family:'Inter',system-ui,sans-serif;">
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">VOID HIERARCHICAL MULTI-AGENT DAG ORCHESTRATION</text>
  <text x="480" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">Supervisor-Orchestrated Directed Acyclic Graph (DAG) with Parallel &amp; Sequential Dependencies</text>

  <!-- User Goal -->
  <rect x="360" y="85" width="240" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="112" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">USER COMPLEX GOAL</text>

  <!-- Planner -->
  <rect x="360" y="155" width="240" height="50" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="178" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">PLANNER AGENT</text>
  <text x="480" y="195" fill="#e0f2fe" font-size="11" text-anchor="middle">Decomposes Goal &amp; Resolves Task Dependencies</text>

  <!-- Downward arrows -->
  <line x1="480" y1="130" x2="480" y2="155" stroke="#38bdf8" stroke-width="2"/>
  <line x1="480" y1="205" x2="480" y2="235" stroke="#38bdf8" stroke-width="2"/>

  <!-- Supervisor Core -->
  <rect x="330" y="235" width="300" height="55" rx="8" fill="#7c3aed" stroke="#c084fc" stroke-width="1.5"/>
  <text x="480" y="258" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">SUPERVISOR AGENT</text>
  <text x="480" y="277" fill="#ede9fe" font-size="11" text-anchor="middle">Shared State, Dynamic Delegation, Event Bus</text>

  <!-- Specialist Agents Row -->
  <line x1="480" y1="290" x2="160" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <line x1="480" y1="290" x2="370" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <line x1="480" y1="290" x2="590" y2="330" stroke="#64748b" stroke-width="1.5"/>
  <line x1="480" y1="290" x2="800" y2="330" stroke="#64748b" stroke-width="1.5"/>

  <!-- Specialist 1: Linux -->
  <rect x="60" y="330" width="200" height="65" rx="8" fill="#1e293b" stroke="#0ea5e9"/>
  <text x="160" y="355" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">Linux Intelligence Agent</text>
  <text x="160" y="373" fill="#94a3b8" font-size="10" text-anchor="middle">KWin, DBus, Sockets, Uptime</text>
  <text x="160" y="387" fill="#64748b" font-size="9" text-anchor="middle">Tools: inspect_system, ss_sockets</text>

  <!-- Specialist 2: Developer -->
  <rect x="270" y="330" width="200" height="65" rx="8" fill="#1e293b" stroke="#22c55e"/>
  <text x="370" y="355" fill="#4ade80" font-size="12" font-weight="600" text-anchor="middle">Developer Agent</text>
  <text x="370" y="373" fill="#94a3b8" font-size="10" text-anchor="middle">TDD Scaffolding, PyTest, Lint</text>
  <text x="370" y="387" fill="#64748b" font-size="9" text-anchor="middle">Tools: scaffold_project, run_tests</text>

  <!-- Specialist 3: Research -->
  <rect x="490" y="330" width="200" height="65" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="590" y="355" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">Research &amp; Productivity</text>
  <text x="590" y="373" fill="#94a3b8" font-size="10" text-anchor="middle">Live DDG, DOCX, XLSX, Notes</text>
  <text x="590" y="387" fill="#64748b" font-size="9" text-anchor="middle">Tools: deep_research, create_docx</text>

  <!-- Specialist 4: Tool Execution -->
  <rect x="700" y="330" width="200" height="65" rx="8" fill="#1e293b" stroke="#ec4899"/>
  <text x="800" y="355" fill="#f472b6" font-size="12" font-weight="600" text-anchor="middle">Tool Execution Agent</text>
  <text x="800" y="373" fill="#94a3b8" font-size="10" text-anchor="middle">4-Tier Perms, Sandboxing</text>
  <text x="800" y="387" fill="#64748b" font-size="9" text-anchor="middle">Tools: 105 Dodaios Hub endpoints</text>

  <!-- Bottom Gates: Verifier & Recovery -->
  <rect x="180" y="430" width="280" height="60" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="455" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">VERIFIER AGENT</text>
  <text x="320" y="473" fill="#94a3b8" font-size="10" text-anchor="middle">Independent Ground-Truth Validation &amp; Evidence Checks</text>

  <rect x="500" y="430" width="280" height="60" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="640" y="455" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">RECOVERY AGENT</text>
  <text x="640" y="473" fill="#94a3b8" font-size="10" text-anchor="middle">Failure Classification, Bounded Retries (Max 2), Replanning</text>

  <line x1="320" y1="395" x2="320" y2="430" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="640" y1="395" x2="640" y2="430" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3"/>
</svg>